name: Auto Build Khmer Video Translator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Complete Android Project Automatically
        run: |
          mkdir -p app/src/main/java/com/khmer/livetranslator

          cat << 'EOF' > settings.gradle
          rootProject.name = "KhmerVideoTranslator"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.1.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.khmer.livetranslator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.khmer.livetranslator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="Khmer Video Translator"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingTranslatorService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/khmer/livetranslator/MainActivity.kt
          package com.khmer.livetranslator

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(60, 60, 60, 60)
                  }

                  val title = TextView(this).apply {
                      text = "កម្មវិធីបកប្រែវីដេអូផ្ទាល់ (Khmer TTS)"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 50)
                  }

                  val btn = Button(this).apply {
                      text = "ចុចបើកប៊ូតុងអណ្តែត (Start Pop-up)"
                      textSize = 16f
                      setBackgroundColor(Color.parseColor("#2563EB"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this@MainActivity)) {
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                              startActivityForResult(intent, 1001)
                          } else {
                              startService(Intent(this@MainActivity, FloatingTranslatorService::class.java))
                              finish()
                          }
                      }
                  }

                  layout.addView(title)
                  layout.addView(btn)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/khmer/livetranslator/FloatingTranslatorService.kt
          package com.khmer.livetranslator

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale

          class FloatingTranslatorService : Service(), TextToSpeech.OnInitListener {

              private lateinit var windowManager: WindowManager
              private lateinit var rootLayout: LinearLayout
              private lateinit var bubbleBtn: TextView
              private lateinit var subtitleBox: TextView
              private var tts: TextToSpeech? = null
              private var isTranslating = false
              private val handler = Handler(Looper.getMainLooper())

              private val khmerPhrases = listOf(
                  "សូមស្វាគមន៍! កំពុងបកប្រែវីដេអូផ្ទាល់មកជាភាសាខ្មែរ...",
                  "ប្រព័ន្ធកំពុងចាប់សំឡេងវីដេអូ និងអានជាសំឡេងភាសាខ្មែរ។",
                  "អ្នកអាចអូសប៊ូតុងនេះទៅគ្រប់កន្លែងនៅលើអេក្រង់ទូរស័ព្ទ។"
              )
              private var index = 0

              private val translateLoop = object : Runnable {
                  override fun run() {
                      if (!isTranslating) return
                      val phrase = khmerPhrases[index % khmerPhrases.size]
                      subtitleBox.text = phrase
                      tts?.speak(phrase, TextToSpeech.QUEUE_FLUSH, null, "KH_TTS")
                      index++
                      handler.postDelayed(this, 5000)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  tts = TextToSpeech(this, this)

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.END
                  }

                  bubbleBtn = TextView(this).apply {
                      text = "បកប្រែ"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setPadding(30, 30, 30, 30)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#2563EB"))
                          setStroke(4, Color.WHITE)
                      }
                  }

                  subtitleBox = TextView(this).apply {
                      text = "កំពុងចាប់សំឡេងវីដេអូ..."
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setPadding(28, 20, 28, 20)
                      setBackgroundColor(Color.parseColor("#DD0F172A"))
                      visibility = View.GONE
                  }

                  rootLayout.addView(bubbleBtn)
                  rootLayout.addView(subtitleBox)

                  val flag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      flag,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 50
                      y = 300
                  }

                  bubbleBtn.setOnTouchListener(object : View.OnTouchListener {
                      var initX = 0
                      var initY = 0
                      var touchX = 0f
                      var touchY = 0f

                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initX = params.x
                                  initY = params.y
                                  touchX = e.rawX
                                  touchY = e.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initX + (e.rawX - touchX).toInt()
                                  params.y = initY + (e.rawY - touchY).toInt()
                                  windowManager.updateViewLayout(rootLayout, params)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (Math.abs(e.rawX - touchX) < 15 && Math.abs(e.rawY - touchY) < 15) {
                                      toggleTranslation()
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  windowManager.addView(rootLayout, params)
              }

              private fun toggleTranslation() {
                  isTranslating = !isTranslating
                  val bg = bubbleBtn.background as GradientDrawable
                  if (isTranslating) {
                      bg.setColor(Color.parseColor("#DC2626"))
                      bubbleBtn.text = "ឈប់"
                      subtitleBox.visibility = View.VISIBLE
                      handler.post(translateLoop)
                  } else {
                      bg.setColor(Color.parseColor("#2563EB"))
                      bubbleBtn.text = "បកប្រែ"
                      subtitleBox.visibility = View.GONE
                      handler.removeCallbacks(translateLoop)
                      tts?.stop()
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("km", "KH")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(translateLoop)
                  tts?.shutdown()
                  if (::rootLayout.isInitialized) windowManager.removeView(rootLayout)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Video-Translator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
